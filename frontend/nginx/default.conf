# ============================================================================
# auris-frontend — Nginx site config (SCRUM-18, HLD §3.3.1)
#
# Two jobs:
#   1) Serve the compiled React app (static files).
#   2) Forward requests starting with /api/ to auris-backend (reverse proxy).
#      The browser only talks to this server → same origin → no CORS needed.
# ============================================================================

server {
    listen 80;
    # Listen on IPv6 too: on alpine "localhost" resolves to ::1, so the
    # compose healthcheck (wget http://localhost/) gets "connection refused"
    # otherwise.
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Do not expose the Nginx version in response headers.
    server_tokens off;

    # --- Security headers ---------------------------------------------------
    # Note: no Content-Security-Policy on purpose; the base map is fetched by
    # the browser from OpenFreeMap and a strict CSP would block it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # --- Compression --------------------------------------------------------
    # The maplibre-gl bundle is large; gzip cuts transfer size ~4x (R14).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- /api reverse proxy -------------------------------------------------
    # No trailing "/" on proxy_pass: the path is forwarded unchanged
    #   browser  GET /api/health  →  backend  GET /api/health
    # (With a trailing "/" the /api prefix is stripped and the backend returns 404.)
    #
    # Docker's embedded DNS (127.0.0.11) + a variable in proxy_pass:
    # the name is re-resolved per request (cached for 10 s), so
    #   - if the backend restarts with a new IP, Nginx needs no restart,
    #   - Nginx can start before the backend is up (returns 502, does not crash).
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $auris_backend http://auris-backend:8000;
        proxy_pass $auris_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Simulation is asynchronous (HTTP 202 + polling, MK4); no request runs long.
        # The longest synchronous step is network validation (target ≤ 2 s, R15).
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # The intervention list is a small JSON payload; reject large bodies (R17).
        client_max_body_size 1m;
    }

    # --- Static assets ------------------------------------------------------
    # Vite puts a content hash in file names (index-a1b2c3.js); when the content
    # changes the name changes too, so these can be cached indefinitely.
    # (add_header in a location replaces the server-level headers, hence repeated.)
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- SPA fallback -------------------------------------------------------
    # Any path that is not a file falls back to index.html, so in-app routes
    # (e.g. /compare later) do not 404 on reload.
    # index.html is not cached, so browsers pick up a new release immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
